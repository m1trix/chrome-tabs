<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tab Groups++</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <nav class="views" role="tablist">
      <button role="tab" data-view="current" aria-selected="true">This window</button>
      <button role="tab" data-view="saved" aria-selected="false">Saved <span id="saved-count" class="count"></span></button>
      <button role="tab" data-view="settings" aria-selected="false">Settings</button>
    </nav>
  </header>

  <section id="view-current">
    <div class="toolbar">
      <button id="dedupe" class="btn" title="Merge groups with the same name and close duplicate tabs">Deduplicate</button>
      <button class="btn import" title="Import groups from exported JSON files">Import…</button>
      <button class="btn merge" title="Pick groups to merge together" aria-pressed="false">Merge</button>
    </div>
    <div id="groups"></div>
    <div id="new-group-zone">Drop here to create a new group</div>

    <div id="ungrouped-zone">
      <h2>Ungrouped tabs</h2>
      <ul id="ungrouped" class="tab-list"></ul>
    </div>

    <div class="merge-bar" hidden>
      <span class="merge-summary"></span>
      <button class="btn merge-cancel">Cancel</button>
      <button class="btn primary merge-confirm" disabled>Merge</button>
    </div>
  </section>

  <section id="view-saved" hidden>
    <div class="toolbar">
      <button id="dedupe-saved" class="btn" title="Merge saved groups with the same name and remove duplicate tabs">Deduplicate</button>
      <button class="btn import" title="Import groups from exported JSON files">Import…</button>
      <button class="btn merge" title="Pick saved groups to merge together" aria-pressed="false">Merge</button>
    </div>
    <div id="saved"></div>

    <div class="merge-bar" hidden>
      <span class="merge-summary"></span>
      <button class="btn merge-cancel">Cancel</button>
      <button class="btn primary merge-confirm" disabled>Merge</button>
    </div>
  </section>

  <section id="view-settings" hidden>
    <div class="setting">
      <span id="layout-label" class="setting-name">Layout:</span>
      <div id="layout" class="segmented" role="radiogroup" aria-labelledby="layout-label"></div>
    </div>
  </section>

  <p id="status" role="status"></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
